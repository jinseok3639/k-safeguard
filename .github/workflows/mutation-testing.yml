name: Mutation testing

on:
  pull_request:
    paths:
      - "src/k_safeguard/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/mutation-testing.yml"

jobs:
  mutmut:
    # mutmut은 Windows 네이티브 실행을 지원하지 않아(WSL 필수) 로컬 검증 대신
    # 이 워크플로가 유일한 실행 경로다. 실행 시간이 길어질 수 있어 src/tests가
    # 바뀐 PR에서만 돈다(다른 파일만 바뀐 PR은 건너뜀).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and mutmut
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .
          python -m pip install "mutmut>=3.7"
      - name: Run mutation testing
        run: mutmut run || true
      - name: Print mutation summary
        run: mutmut results
      - name: Generate HTML report
        run: mutmut html
      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-report
          path: html/
