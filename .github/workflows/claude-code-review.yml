name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # settings는 러너의 ~/.claude/settings.json(유저 레벨)에 주입됨.
          # 저장소에 커밋한 .claude/settings.json은 SDK/헤드리스 모드에서
          # 워크스페이스 trust dialog를 못 띄워 allow 규칙이 무시될 수 있어
          # (anthropics/claude-code#32459), 여기서 직접 허용해야 함.
          #
          # 별도 샌드박스 리포에서 실측 검증한 결과:
          # - code-review 플러그인은 Skill 툴로 실행되므로 Skill 자체를 허용해야
          #   플러그인 진입이 가능함 (없으면 permission_denied로 스킬 실행이 막힘)
          # - 플러그인 내부에서 git ls-files, 일반 grep, cd && git 등 다양한
          #   서브커맨드를 호출해서 Bash(gh:*) 같은 좁은 패턴으로는 부족함 -> Bash 전체 허용
          settings: |
            {
              "permissions": {
                "allow": [
                  "Skill",
                  "Bash",
                  "Read",
                  "Glob",
                  "Grep"
                ]
              }
            }
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

