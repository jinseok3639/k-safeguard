name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 리뷰 에이전트가 git 히스토리(blame, 이전 커밋 맥락)를 참조할 수 있도록
          # 전체 히스토리를 받는다. 리포 팩 크기가 1MB 미만이라 비용이 거의 없다.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'

          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            추가 지침 (code-review 플러그인 기본 동작보다 우선한다):
            - 서브에이전트는 반드시 동기(synchronous)로 실행해라. 백그라운드/async
              에이전트를 띄우지 마라. 이 실행은 헤드리스라 완료 알림을 받을 다음 턴이
              없다. 백그라운드 에이전트를 띄우고 "기다리겠다"고 말하는 순간 런이 그대로
              끝나고 리뷰는 아무 코멘트도 남기지 못한다.
            - "완료되면 진행하겠다" 같은 말로 턴을 끝내지 마라. 필요한 결과는 같은 턴
              안에서 끝까지 받아내고, 마지막에 반드시 코멘트를 게시하고 끝내라.
            - 1단계 eligibility 체크에서 "trivial" 또는 "리뷰 불필요"로 판단하더라도
              그냥 종료하지 마라. 문서 전용 PR과 작은 변경도 리뷰 대상이다.
            - 어떤 경로로 끝나든 반드시 PR에 흔적을 남겨라:
              - 리뷰를 건너뛰기로 했다면 `gh pr comment`로 그 사유를 한 줄 남긴다.
              - 이슈가 하나도 없으면 `gh pr comment`로 "No issues found" 요약을 남긴다.
              - 이슈가 있으면 평소대로 인라인 코멘트를 남긴다.
              코멘트를 하나도 남기지 않고 종료하는 것은 실패로 간주한다.

          # claude_args의 --allowedTools는 "권한"만이 아니라 어떤 GitHub MCP 서버를
          # 설치할지도 결정한다. claude-code-action의 src/modes/agent/index.ts가
          # parseAllowedTools(CLAUDE_ARGS)로 목록을 뽑고, install-mcp-server.ts가
          # `mcp__github_inline_comment__` 접두사가 있을 때만 github_inline_comment
          # 서버를 등록한다. settings 블록의 permissions.allow는 이 판정에 쓰이지
          # 않으므로, 이 줄이 없으면 SDK init의 mcp_servers가 [] 로 뜬다.
          #
          # 이게 없어도 리뷰가 아예 안 되는 건 아니다 — Claude가 Bash로
          # `gh api .../pulls/N/comments`를 직접 호출해 우회한다(샌드박스 리포에서
          # 실측 확인). 다만 그 경로는 classify_inline_comments 처리와 버퍼 게시를
          # 건너뛰고, #34처럼 인라인 대신 최상위 코멘트 하나로 뭉뚱그려지기도 한다.
          # 의도된 경로로 태우기 위해 명시한다.
          #
          # 참고: 실행 로그 마지막의 "No buffered inline comments"는 MCP 버퍼만
          # 보고하는 메시지다. 서버가 미등록이면 코멘트 성공 여부와 무관하게 항상
          # 찍히므로, 이 줄을 실패 신호로 읽으면 안 된다.
          #
          # --disallowedTools: 리뷰 실행이 백그라운드 에이전트를 띄운 뒤 "결과를
          # 기다리겠다"며 턴을 끝내 리뷰가 통째로 중단된 사례가 있었다(샌드박스 PR #3,
          # 최종 result가 "I'll wait for the eligibility check agent to complete").
          # 그때 ScheduleWakeup 호출도 함께 시도했으므로, 헤드리스 실행에서 쓸 일이
          # 없는 스케줄링·백그라운드 제어 툴과 쓰기 툴을 아예 차단한다.
          claude_args: |
            --allowedTools "Skill,Task,TodoWrite,Read,Glob,Grep,Bash,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "ScheduleWakeup,CronCreate,CronDelete,CronList,PushNotification,RemoteTrigger,Monitor,Write,Edit,NotebookEdit,WebSearch,WebFetch"

          # settings는 러너의 ~/.claude/settings.json(유저 레벨)에 주입됨.
          # 저장소에 커밋한 .claude/settings.json은 SDK/헤드리스 모드에서
          # 워크스페이스 trust dialog를 못 띄워 allow 규칙이 무시될 수 있어
          # (anthropics/claude-code#32459), 여기서 직접 허용해야 함.
          #
          # 별도 샌드박스 리포에서 실측 검증한 결과:
          # - code-review 플러그인은 Skill 툴로 실행되므로 Skill 자체를 허용해야
          #   플러그인 진입이 가능함 (없으면 permission_denied로 스킬 실행이 막힘)
          # - 플러그인 내부에서 git ls-files, 일반 grep, cd && git 등 다양한
          #   서브커맨드를 호출해서 Bash(gh:*) 같은 좁은 패턴으로는 부족함 -> Bash 전체 허용
          # - 플러그인이 단계마다 서브에이전트를 띄우므로 Task도 필요함
          settings: |
            {
              "permissions": {
                "allow": [
                  "Skill",
                  "Task",
                  "TodoWrite",
                  "Bash",
                  "Read",
                  "Glob",
                  "Grep",
                  "mcp__github_inline_comment__create_inline_comment"
                ]
              }
            }

          # 상세 로그. 기본값이 둘 다 false라 지금까지 실행 로그에 결과가 남지 않아
          # 리뷰가 왜 조용히 끝났는지 사후 진단이 불가능했다.
          # - display_report: 리뷰 리포트를 Actions Step Summary에 렌더링
          # - show_full_output: Claude의 전체 메시지/툴 결과 JSON을 로그에 출력
          #
          # 주의: 이 리포는 public이라 show_full_output을 켜면 툴 실행 결과가 공개
          # 로그에 그대로 남는다. GitHub이 마스킹하는 secrets 외에 민감한 값을
          # 리뷰 대상 코드에 두지 말 것. 진단이 끝나면 false로 되돌려도 되고,
          # 그 경우 아래 아티팩트 업로드만으로도 전체 실행 로그는 계속 확보된다.
          display_report: true
          show_full_output: true

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # 실행 로그 원본(claude-execution-output.json)을 아티팩트로 보존한다.
      # 러너 임시 디렉터리에 저장된 뒤 잡이 끝나면 사라지므로, 남겨두지 않으면
      # 나중에 "왜 코멘트가 없었나"를 되짚을 근거가 없다.
      - name: Upload Claude execution log
        if: always() && steps.claude-review.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-log-pr${{ github.event.pull_request.number }}-attempt${{ github.run_attempt }}
          path: ${{ steps.claude-review.outputs.execution_file }}
          retention-days: 14
          if-no-files-found: warn
