name: Publish package to TestPyPI

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "배포 승인 문구: publish-testpypi"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Require the default branch
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "TestPyPI 배포는 기본 브랜치에서만 실행할 수 있습니다." >&2
          exit 1
      - name: Require explicit confirmation
        if: github.event.inputs.confirm != 'publish-testpypi'
        run: |
          echo "확인 입력값이 publish-testpypi와 일치하지 않습니다." >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated build tools
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Verify source and distribution boundaries
        run: python tools/release/verify_artifacts.py
      - name: Check package metadata rendering
        run: python -m twine check dist/*
      - name: Export package version
        id: package
        shell: bash
        run: echo "version=$(python tools/release/verify_artifacts.py --source-only --print-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/k-safeguard
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-test:
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the uploaded wheel without dependencies
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if python -m pip install \
              --no-cache-dir \
              --no-deps \
              --index-url https://test.pypi.org/simple/ \
              "k-safeguard==$PACKAGE_VERSION"; then
              exit 0
            fi
            echo "TestPyPI 반영 대기: ${attempt}/5"
            sleep 10
          done
          exit 1
      - name: Run installed-package smoke test
        run: python -c "from k_safeguard import Gateway; assert Gateway().process('ㅇㅏㄴ').normalized == '안'"
