name: GitHub Pages demo

on:
  pull_request:
    paths:
      - "src/**"
      - "web/**"
      - "tools/web/**"
      - "tests/test_web_demo.py"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "tools/web/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Build static site
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          python tools/web/build_site.py --wheel "$wheel" --output _site --commit "$GITHUB_SHA"
          node --check _site/app.js
          node --check _site/worker.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 저장소 Settings > Pages > Source가 "GitHub Actions"로 한 번 설정돼 있어야 한다.
      # 기본 GITHUB_TOKEN은 Pages 사이트를 새로 만들 권한이 없어 enablement 옵션이 동작하지 않는다.
      # 최초 설정 절차는 dev_note/RELEASING.md 7절을 따른다.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
